packages:
    - "apps/*"
    # The NEAR Auth wallet keeps its own lockfile, so the script every dapp loads never changes with the workspace's dependencies
    - "!apps/near-connect"
    - "contracts/*"
    - "contracts/jwt-guards/*"
    - "docs"
    - "packages/auth"
    - "packages/auth0"
    - "packages/backend/*"
    - "packages/sdks/*"
    - "packages/providers/*"
    - "packages/shared/*"
    - "examples/custom-backend"
    - "examples/spa"
    - "examples/mobile"
